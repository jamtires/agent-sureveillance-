name: JAMTIRES Monitoring

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    name: Tests Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: monitoring/package-lock.json

      - name: Installation des dépendances
        working-directory: monitoring
        run: npm ci

      - name: Installation du navigateur Chromium
        working-directory: monitoring
        run: npx playwright install --with-deps chromium

      - name: Lancement des tests de surveillance
        working-directory: monitoring
        run: npm run test:monitoring
        env:
          PLATFORM_URL: https://tyre-solution.be

      - name: Génération du contexte d'échec
        if: failure()
        working-directory: monitoring
        run: npm run build:failure-context

      - name: Analyse des échecs avec Claude
        if: failure()
        working-directory: monitoring
        run: npm run analyze:failure
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload des artefacts (rapport + analyse)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            monitoring/playwright-report/
            monitoring/test-results/
            monitoring/output/
          retention-days: 7
